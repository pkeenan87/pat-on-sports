version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      # TypeScript 7 is the native Go compiler and does not yet expose the
      # Language Service API that @astrojs/check (Volar) needs. Its peer range
      # is typescript ^5 || ^6, so a 7.x bump fails `npm ci`. Revisit when
      # Astro supports TS 7 (withastro/roadmap#1321).
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      # Astro's integrations are versioned against the core package; a solo
      # bump of @astrojs/react or @astrojs/sitemap can land on a core it
      # doesn't support, so they travel together.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      # React's peer-dep requires react and react-dom to be exact-version
      # matched — a solo react-dom bump fails `npm ci` with ERESOLVE. The
      # @types packages ride along so the types don't drift behind runtime.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Tailwind v4 ships the engine and the Vite plugin as separate packages
      # that must stay on the same minor.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # Vitest and its coverage provider are lockstep by major.
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # CodeQL refuses to run when init and analyze (or any other
      # codeql-action/* step) are pinned to different versions. A solo bump
      # of one step fails the analyze job, so they travel together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
