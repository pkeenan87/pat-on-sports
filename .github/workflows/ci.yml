name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Guard against large public assets
        run: |
          # Recordings belong on Vercel Blob (`npm run upload-audio`), not in git.
          # Hero images today are well under 2 MB; fail closed if something big lands in public/.
          found="$(find public -type f -size +2M -print)"
          if [ -n "$found" ]; then
            echo "Files under public/ exceed 2 MB:"
            echo "$found"
            exit 1
          fi

      # `astro check` typechecks .astro/.ts/.tsx *and* validates every post in
      # `posts/` against the Zod schema in src/content.config.ts. A post with a
      # malformed date or a missing description fails here rather than at deploy.
      - name: Typecheck and validate content
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        # Matches the production Vercel build, so a broken canonical URL,
        # sitemap entry, or RSS feed surfaces on the PR.
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://patonsports.com

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fail-closed at high+. The blast radius of a dependency advisory is the build
      # toolchain plus the comment API runtime; `overrides` in package.json already
      # pins the transitive packages Dependabot cannot reach on its own.
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL (security-extended)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the commit range, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
